# React/Vite 빌드 결과물을 제공하는 Nginx 가상 호스트 설정입니다.
server {
    # 기존 서비스가 사용하는 80, 443, 8080, 8090을 피해 3000 포트를 사용합니다.
    listen 3000;
    listen [::]:3000;

    # 실제 도메인이 정해지면 _ 대신 scrap.example.com처럼 변경합니다.
    server_name _;

    root /var/www/scrap-web;
    index index.html;

    access_log /var/log/nginx/scrap-web.access.log;
    error_log /var/log/nginx/scrap-web.error.log;

    # 해시가 포함된 Vite 자산은 오랫동안 캐시해도 새 배포 파일과 충돌하지 않습니다.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 실제 파일이 없는 React Router 주소는 index.html로 보내 브라우저 라우팅에 맡깁니다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html은 새 배포를 바로 확인할 수 있도록 장기 캐시하지 않습니다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
